<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenData Analytics | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .chart-container {
        position: relative;
        height: 300px;
        width: 100%;
      }
      .card {
        @apply bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow duration-300;
      }
      .kpi-title {
        @apply text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1;
      }
      .kpi-value {
        @apply text-3xl font-bold text-slate-800;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav
      class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-8 py-4 sticky top-0 z-50"
    >
      <div class="max-w-7xl mx-auto flex justify-end items-center">
        <div class="flex items-center gap-3">
          <div
            class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-200"
          >
            <i class="fas fa-chart-pie text-lg"></i>
          </div>

          <div class="text-right">
            <span class="font-bold text-xl tracking-tight text-slate-800"
              >Analytics<span class="text-blue-600">Hub</span></span
            >
            <p
              class="text-[10px] text-slate-400 font-medium uppercase tracking-tighter"
            >
              Open Data Registry
            </p>
          </div>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-8 py-10">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
