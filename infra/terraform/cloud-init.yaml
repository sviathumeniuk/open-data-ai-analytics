package_update: true

runcmd:
  # 1. Preparation
  - dnf update -y
  - dnf install -y git curl dnf-utils

  # 2. Docker Stack
  - dnf config-manager --add-repo=https://download.docker.com/linux/centos/docker-ce.repo
  - dnf install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker

  # 3. Deployment
  - mkdir -p /opt/app
  - git clone https://github.com/sviathumeniuk/open-data-ai-analytics.git /opt/app

  # 4. Environment
  - |
    cat <<EOF > /opt/app/.env
    SQLITE_DB_PATH=/workspace/data/analytics.db
    TABLE_NAME=vat_registry

    CSV_PATH=/workspace/raw/pdv_actual_28-08-2019.csv
    FIGURES_ROOT=/workspace/reports/figures
    QUALITY_REPORT_PATH=/workspace/reports/data_quality/latest.json
    RESEARCH_REPORT_PATH=/workspace/reports/data_research/summary.json

    ECONOMIC_EVENT_YEAR=2014
    EOF

  # 5. Launch
  - cd /opt/app && docker compose up -d

  # 6. Logging
  - logger 'Cloud-init execution finished'
