apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-data-analytics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sviathumeniuk/open-data-ai-analytics.git'
    targetRevision: HEAD
    path: gitops/app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: analytics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
