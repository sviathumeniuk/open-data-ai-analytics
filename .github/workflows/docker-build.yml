name: Build and Push Docker Image
on:
  push:
    branches: [ "main" ]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sviathumeniuk/open-data-ai-analytics
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update deployment image tag
        run: |
          sed -i "s|ghcr.io/sviathumeniuk/open-data-ai-analytics:sha-.*|ghcr.io/sviathumeniuk/open-data-ai-analytics:sha-${{ github.sha }}|g" gitops/app/deployment.yaml
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add gitops/app/deployment.yaml
          git commit -m "ci: update image tag to sha-${{ github.sha }}"
          git push