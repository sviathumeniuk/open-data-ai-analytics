name: CI Pipeline (Self-Hosted)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Оберіть модуль для тестування"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - data_processing
          - analysis
          - visualizations

jobs:
  build_and_test:
    runs-on: [self-hosted, linux]
    if: github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module
    strategy:
      fail-fast: false
      matrix:
        module: [data_processing, analysis, visualizations]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run module check
        run: |
          python -m py_compile src/${{ matrix.module }}.py

      - name: Generate results to artifacts/
        run: |
          mkdir -p artifacts/${{ matrix.module }}
          echo "Success" > artifacts/${{ matrix.module }}/log.txt
          echo "run_id=${{ github.run_id }}" >> artifacts/${{ matrix.module }}/log.txt
          echo "event=${{ github.event_name }}" >> artifacts/${{ matrix.module }}/log.txt
          echo "module=${{ matrix.module }}" >> artifacts/${{ matrix.module }}/log.txt
          echo "runner=${{ runner.name }}" >> artifacts/${{ matrix.module }}/log.txt

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfhosted-audit-${{ matrix.module }}-${{ github.run_number }}
          path: artifacts/${{ matrix.module }}
          if-no-files-found: error
