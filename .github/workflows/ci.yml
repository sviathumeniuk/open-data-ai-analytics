name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      module:
        description: "Оберіть модуль для тестування"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - data_processing
          - analysis
          - visualizations

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      data_processing: ${{ steps.filter.outputs.data_processing }}
      analysis: ${{ steps.filter.outputs.analysis }}
      visualizations: ${{ steps.filter.outputs.visualizations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data_processing:
              - 'src/data_processing.py'
            analysis:
              - 'src/analysis.py'
            visualizations:
              - 'src/visualizations.py'

  build_and_test:
    needs: detect_changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [data_processing, analysis, visualizations]

    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module)) ||
      (github.event_name != 'workflow_dispatch' && needs.detect_changes.outputs[matrix.module] == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run module check 
        run: |
          python -m py_compile src/${{ matrix.module }}.py

      - name: Generate results to artifacts/
        run: |
          mkdir -p artifacts/${{ matrix.module }}
          echo "Success" > artifacts/${{ matrix.module }}/log.txt