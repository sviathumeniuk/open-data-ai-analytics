name: CI Pipeline

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      module:
        description: "Оберіть модуль для тестування"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - data_processing
          - analysis
          - visualizations

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      data_processing: ${{ steps.filter.outputs.data_processing }}
      analysis: ${{ steps.filter.outputs.analysis }}
      visualizations: ${{ steps.filter.outputs.visualizations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data_processing:
              - 'src/data_processing.py'
            analysis:
              - 'src/analysis.py'
            visualizations:
              - 'src/visualizations.py'

  build_and_test:
    needs: detect_changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [data_processing, analysis, visualizations]

    steps:
      - name: Determine if module should run
        id: should_run
        run: |
          DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          INPUT_MODULE="${{ github.event.inputs.module }}"
          MATRIX_MODULE="${{ matrix.module }}"
          CHANGED="${{ needs.detect_changes.outputs[matrix.module] }}"

          if [[ "$DISPATCH" == "true" && ("$INPUT_MODULE" == "all" || "$INPUT_MODULE" == "$MATRIX_MODULE") ]]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          elif [[ "$DISPATCH" == "false" && "$CHANGED" == "true" ]]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.should_run.outputs.result == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.should_run.outputs.result == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.should_run.outputs.result == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run module check
        if: steps.should_run.outputs.result == 'true'
        run: |
          python -m py_compile src/${{ matrix.module }}.py

      - name: Generate results to artifacts/
        if: steps.should_run.outputs.result == 'true'
        run: |
          mkdir -p artifacts/${{ matrix.module }}
          echo "Success" > artifacts/${{ matrix.module }}/log.txt
          echo "run_id=${{ github.run_id }}" >> artifacts/${{ matrix.module }}/log.txt
          echo "event=${{ github.event_name }}" >> artifacts/${{ matrix.module }}/log.txt
          echo "module=${{ matrix.module }}" >> artifacts/${{ matrix.module }}/log.txt

      - name: Upload audit artifact
        if: steps.should_run.outputs.result == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.module }}-${{ github.run_number }}
          path: artifacts/${{ matrix.module }}
          if-no-files-found: error

  deploy_pages:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build reports index page
        run: python scripts/build_reports_index.py

      - name: Deploy reports to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./reports
          force_orphan: true
